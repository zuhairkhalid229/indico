name: verify-7889 (fork only)
on:
  push:
    branches: [ 'ci/**' ]
permissions:
  contents: read
jobs:
  stylelint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package*.json
      - run: npm ci
      - name: stylelint on the changed files
        run: |
          npx stylelint --formatter unix indico/web/client/styles/editor-output.scss indico/web/client/styles/modules/event_display/_meetings.scss
          echo "stylelint - changed files clean"
      - name: stylelint on all files (as CI does on push)
        run: |
          npx stylelint --formatter unix 'indico/**/*.{scss,css}'
          echo "stylelint - all files clean"
